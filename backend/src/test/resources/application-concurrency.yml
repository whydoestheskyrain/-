# ============================================================
# 并发集成测试专用配置（@ActiveProfiles("concurrency")）
# 1) 指向独立隔离库 trade_concurrency_test（结构复制自开发库，绝不触碰开发库/生产库）
# 2) 连接池放大到 60，保证 50 个并发线程各自持有独立数据库连接与独立事务
# 3) 关闭 sql.init，表结构完全来自 mysqldump，禁止测试启动时自动建表
# 4) 关闭 MyBatis SQL 标准输出，避免多线程测试刷屏
# 用户名/密码仍由 application.yml 中 spring.config.import 引入的 application-local.yml 提供
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/trade_concurrency_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    hikari:
      maximum-pool-size: 60
  sql:
    init:
      mode: never

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
