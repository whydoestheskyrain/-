# ============================================================
# 虚拟交易平台 Nginx 配置（Docker 容器版）
# 容器内后端服务名为 backend，端口 8081
# ============================================================

server {
    listen       80;
    server_name  121.41.63.99;

    root   /usr/share/nginx/html;
    index  index.html;

    client_max_body_size 10m;

    # ---------- 前端静态资源（Vue hash 路由回退） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ---------- 后端接口反代（容器服务名 backend） ----------
    location ~ ^/(user|product|order|gameType|transaction|recharge|alipay|pet|feedback|notification|admin|api|uploads)/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- WebSocket（预留） ----------
    location /ws/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}
